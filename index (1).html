<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برگه عضویت اشخاص حقوقی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1c2433; --muted:#667085; --line:#e3e8ef;
  --brand:#1f5eff; --brand-ink:#fff; --brand-soft:#e8efff;
  --ok:#0f9d58; --ok-soft:#e3f6ec; --warn:#b26b00; --warn-soft:#fff3dc; --bad:#d92d20; --bad-soft:#fde8e6;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Vazirmatn","B Nazanin",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#b9c4d8;background:#f8faff}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.btn.primary:hover{background:#174ad6}
.btn.danger{color:var(--bad);border-color:#f3c4bf}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:19px;margin:0}
.chip{background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 12px;font-size:12.5px;font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn);cursor:pointer;border:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.menu{position:relative}
.menu summary{list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;left:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.14);min-width:210px;padding:6px;z-index:40}
.menu-pop button{display:block;width:100%;text-align:right;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.menu-pop button:hover{background:#f2f5fb}
.menu-pop button.danger{color:var(--bad)}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 24px 6px}
.search{position:relative;flex:1 1 320px;max-width:560px}
.search input{width:100%;padding:10px 40px 10px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14.5px}
.search .ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clr{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;display:none}
.search.has .clr{display:block}
.tools select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
#resultInfo{color:var(--muted);font-size:13px;margin-inline-start:auto}

main{padding:8px 24px 40px}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 190px)}
table#tbl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
#tbl th,#tbl td{padding:9px 12px;border-bottom:1px solid var(--line);border-inline-start:1px solid #f0f3f8;text-align:center;vertical-align:middle;background:var(--card);max-width:340px}
#tbl td.wrap{text-align:right;min-width:230px;white-space:normal}
#tbl td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbl td.wrap{overflow:visible}
#tbl thead th{position:sticky;top:0;background:#eef2f9;font-weight:700;cursor:pointer;user-select:none;z-index:5;white-space:nowrap}
#tbl thead th:hover{background:#e3eaf7}
#tbl thead th .arrow{color:var(--brand);margin-inline-start:4px}
#tbl .s1{position:sticky;right:0;z-index:3;min-width:56px;width:56px}
#tbl .s2{position:sticky;right:56px;z-index:3;text-align:right;font-weight:700;min-width:190px;box-shadow:-1px 0 0 var(--line) inset}
#tbl thead .s1,#tbl thead .s2{z-index:7}
#tbl .act{position:sticky;left:0;z-index:3;white-space:nowrap;min-width:130px;box-shadow:1px 0 0 var(--line) inset}
#tbl thead .act{z-index:7;cursor:default}
#tbl tbody tr{cursor:pointer}
#tbl tbody tr:hover td{background:#f6f9ff}
mark{background:#ffe27a;color:inherit;border-radius:3px;padding:0 1px}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:500}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.part{background:var(--warn-soft);color:var(--warn)}
.flag{color:var(--bad);cursor:help;margin-inline-start:4px}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:18px}
.empty .btn{margin:6px 4px}

dialog{border:0;border-radius:16px;padding:0;width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 24px 70px rgba(16,24,40,.3);color:var(--ink);background:var(--card)}
dialog.narrow{width:min(560px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(16,24,40,.45)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2;border-radius:16px 16px 0 0}
.dhead h2{margin:0;font-size:17px}
.x{border:0;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.dbody{padding:18px 22px;overflow:auto;max-height:calc(100vh - 160px)}
.dfoot{display:flex;gap:8px;justify-content:flex-start;padding:14px 22px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 16px 16px;position:sticky;bottom:0}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 14px;padding:12px 14px 14px}
legend{padding:0 8px;font-weight:700;color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.grid .full{grid-column:1/-1}
.grid .two{grid-column:span 2}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid #cfd7e6;border-radius:9px;background:#fff;color:var(--ink);font-size:14px}
label.f textarea{resize:vertical;min-height:58px}
.num{direction:ltr;text-align:right}
.hint{display:block;min-height:16px;font-size:12px;color:var(--warn);margin-top:2px}
.hint.bad{color:var(--bad)}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin-top:10px}
.docs label{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.docs input{width:17px;height:17px;accent-color:var(--brand)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px;margin-top:6px}
.cols label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.row2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;cursor:pointer}
.note{background:var(--brand-soft);color:#17399b;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#1c2433;color:#fff;padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--bad)}

@media(max-width:760px){
  .top,.tools,main{padding-inline:12px}
  .grid,.cols,.docs,.row2{grid-template-columns:1fr}
  .grid .two{grid-column:auto}
  #resultInfo{margin-inline-start:0;width:100%}
}

/* ===== چاپ ===== */
#printArea{display:none}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;direction:rtl;font-family:"B Nazanin","Vazirmatn",Tahoma,sans-serif;color:#000}
  #printArea h2{text-align:center;margin:0 0 6px;font-size:1.5em}
  #printArea table{width:100%;border-collapse:collapse;table-layout:auto}
  #printArea th,#printArea td{border:.6px solid #000;padding:2px 3px;text-align:center;vertical-align:middle;overflow-wrap:break-word;line-height:1.35}
  #printArea td.nw,#printArea th.nw{white-space:nowrap}
  #printArea th{background:#e4e4e4!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea thead{display:table-header-group}
  #printArea tr{break-inside:avoid;page-break-inside:avoid}
}
</style>
<style id="pageStyle"></style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>برگه عضویت اشخاص حقوقی</h1>
    <span id="count" class="chip">۰ عضو</span>
    <button id="dirtyChip" class="chip warn" hidden title="برای محافظت از اطلاعات، یک خروجی اکسل بگیرید"></button>
  </div>
  <div class="actions">
    <button id="btnAdd" class="btn primary">＋ افزودن عضو</button>
    <button id="btnImport" class="btn">ورود از اکسل</button>
    <button id="btnExport" class="btn">خروجی اکسل</button>
    <button id="btnPrint" class="btn">🖨 پرینت</button>
    <details class="menu" id="moreMenu">
      <summary class="btn" aria-label="گزینه‌های بیشتر">⋯</summary>
      <div class="menu-pop">
        <button id="btnBackup">پشتیبان‌گیری (فایل JSON)</button>
        <button id="btnRestore">بازیابی از پشتیبان</button>
        <button id="btnClear" class="danger">حذف همه اعضا</button>
      </div>
    </details>
  </div>
</header>

<section class="tools">
  <div class="search" id="searchBox">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="جستجو در همه ستون‌ها: نام شرکت، مدیرعامل، کد ملی، شماره پروانه، تلفن…" autocomplete="off">
    <button class="clr" id="qClear" title="پاک کردن" aria-label="پاک کردن جستجو">×</button>
  </div>
  <select id="fLevel" title="پایه اجرا"><option value="">همه پایه‌ها</option><option>1</option><option>2</option><option>3</option></select>
  <select id="fStatus" title="وضعیت مدارک"><option value="">همه وضعیت مدارک</option><option>کامل</option><option>ناقص</option></select>
  <select id="fField" title="رشته تحصیلی"><option value="">همه رشته‌ها</option></select>
  <span id="resultInfo"></span>
</section>

<main>
  <div class="tablewrap" id="tableWrap">
    <table id="tbl"><thead></thead><tbody></tbody></table>
  </div>
  <div id="empty" class="empty" hidden></div>
</main>

<!-- فرم عضو -->
<dialog id="dlgForm">
  <form id="form" autocomplete="off">
    <div class="dhead"><h2 id="formTitle">افزودن عضو</h2><button type="button" class="x" data-close aria-label="بستن">×</button></div>
    <div class="dbody" id="formBody"></div>
    <div class="dfoot">
      <button type="submit" class="btn primary">ذخیره</button>
      <button type="button" class="btn" data-close>انصراف</button>
    </div>
  </form>
</dialog>

<!-- تنظیمات پرینت -->
<dialog id="dlgPrint" class="narrow">
  <div class="dhead"><h2>پرینت لیست اعضا</h2><button type="button" class="x" data-close aria-label="بستن">×</button></div>
  <div class="dbody">
    <div class="row2">
      <label class="f">اندازه کاغذ<select id="pPaper"><option value="A4">A4</option><option value="A3">A3</option></select></label>
      <label class="f">جهت صفحه<select id="pOrient"><option value="landscape">افقی</option><option value="portrait">عمودی</option></select></label>
    </div>
    <label class="f" style="margin-bottom:10px">عنوان بالای صفحه (اختیاری)<input id="pTitle" placeholder="مثلاً: لیست اعضای حقوقی"></label>
    <div class="row2">
      <label class="f">محدوده<select id="pScope"><option value="all">همه اعضا</option><option value="filtered">فقط نتیجه جستجو / فیلتر فعلی</option></select></label>
      <label class="f">اندازه قلم<select id="pFont"><option value="auto">خودکار (متناسب با صفحه)</option><option value="7">۷</option><option value="8">۸</option><option value="9">۹</option><option value="10">۱۰</option><option value="11">۱۱</option><option value="12">۱۲</option></select></label>
    </div>
    <label class="chk"><input type="checkbox" id="pHideEmpty" checked> ستون‌هایی که برای همه اعضا خالی‌اند حذف شوند</label>
    <div style="margin-top:8px;font-weight:700">ستون‌های چاپ</div>
    <div class="cols" id="pCols"></div>
    <div class="note">ردیف‌ها و ستون‌های اضافه چاپ نمی‌شوند؛ فقط اعضا چاپ می‌شوند و سرتیتر جدول در هر صفحه تکرار می‌شود. اگر ستون‌ها زیاد است، کاغذ A3 یا ستون‌های کمتر انتخاب کنید.</div>
  </div>
  <div class="dfoot">
    <button class="btn primary" id="pGo">🖨 پرینت</button>
    <button class="btn" data-close>انصراف</button>
  </div>
</dialog>

<!-- نحوه ورود -->
<dialog id="dlgImport" class="narrow">
  <div class="dhead"><h2>ورود از اکسل</h2><button type="button" class="x" data-close aria-label="بستن">×</button></div>
  <div class="dbody"><label class="f" id="impSheetRow" hidden style="margin-bottom:12px">این فایل چند برگه دارد؛ اعضا از کدام برگه وارد شوند؟<select id="impSheet"></select></label><p id="impMsg" style="margin-top:0"></p></div>
  <div class="dfoot">
    <button class="btn primary" id="impAdd">افزودن به لیست فعلی</button>
    <button class="btn danger" id="impReplace">جایگزینی کل لیست</button>
    <button class="btn" data-close>انصراف</button>
  </div>
</dialog>

<div id="printArea"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileXlsx" accept=".xlsx" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
/*CORE-START*/
'use strict';
/* ---------- تعریف ستون‌ها (همان ترتیب اکسل) ---------- */
const FIELDS=[
 {k:'memberNo',l:'شماره عضویت',w:13},
 {k:'company',l:'نام شرکت',w:30},
 {k:'ceo',l:'نام مدیر عامل',w:24},
 {k:'nationalId',l:'کد ملی',w:16},
 {k:'joinDate',l:'تاریخ عضویت',w:16,date:1},
 {k:'field',l:'رشته تحصیلی',w:16},
 {k:'bachelor',l:'مدرک دوره کارشناسی',w:20},
 {k:'lastDegree',l:'آخرین مدرک تحصیلی',w:20},
 {k:'engNo',l:'شماره عضویت نظام مهندسی',w:24},
 {k:'licenseNo',l:'شماره پروانه اجرا',w:20},
 {k:'firstLicense',l:'تاریخ صدور اولین پروانه',w:20,date:1},
 {k:'licenseExpiry',l:'تاریخ اعتبار پروانه',w:20,date:1},
 {k:'level',l:'پایه اجرا',w:10},
 {k:'workAddr',l:'آدرس محل کار',w:45,long:1},
 {k:'homeAddr',l:'آدرس محل سکونت',w:45,long:1},
 {k:'mobile',l:'تلفن همراه',w:16},
 {k:'phone',l:'تلفن ثابت',w:16},
 {k:'status',l:'مدارک ضمیمه',w:14}
];
const DOCS=[
 'کپی صفحه اول شناسنامه مدیر عامل',
 'کپی کارت ملی مدیر عامل',
 'کپی پشت و رو پروانه اجرا مدیر عامل و شرکت',
 'دو قطعه عکس 3*4 مدیر عامل',
 'فیش واریزی',
 'آخرین روزنامه رسمی تأیید شده توسط دبیرخانه انجمن'
];
const HEADER_ALIASES={ licenseExpiry:['تاریخ اعبار پروانه'] };

/* ---------- نرمال‌سازی متن ---------- */
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function latinDigits(s){return String(s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-0x06F0).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-0x0660)}
function cleanText(s){
  if(s==null) return '';
  return latinDigits(String(s)).replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u200f\u200e\u00a0]/g,' ').replace(/[\r\n\t]+/g,' ').replace(/ {2,}/g,' ').trim();
}
function fixDate(s){
  s=cleanText(s);
  const m=/^(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})$/.exec(s);
  return m?`${m[1]}/${m[2].padStart(2,'0')}/${m[3].padStart(2,'0')}`:s;
}
function fixNid(s){
  s=cleanText(s); if(!s) return '';
  const d=s.replace(/[\s\-]/g,'');
  if(/^\d{1,10}$/.test(d)) return d.padStart(10,'0');
  const m=/\d{10}/.exec(d); return m?m[0]:s;
}
function fixPhone(s,mobile){
  s=cleanText(s).replace(/[\s\-()]/g,''); if(!s) return '';
  if(!/^\d+$/.test(s)) return s;
  if(mobile) return /^9\d{9}$/.test(s)?'0'+s:s;
  return /^[1-8]\d{9}$/.test(s)?'0'+s:s;
}
function normField(f,v){
  switch(f.k){
    case 'nationalId': return fixNid(v);
    case 'mobile': return fixPhone(v,true);
    case 'phone': return fixPhone(v,false);
    default: return f.date?fixDate(v):cleanText(v);
  }
}
function validNid(s){
  if(!/^\d{10}$/.test(s)||/^(\d)\1{9}$/.test(s)) return false;
  let sum=0; for(let i=0;i<9;i++) sum+=(+s[i])*(10-i);
  const r=sum%11, c=r<2?r:11-r; return c===+s[9];
}
/* 1:1 نرمال‌سازی برای جستجو (طول رشته تغییر نمی‌کند تا هایلایت درست باشد) */
function normSearch(s){
  return latinDigits(String(s??'')).toLowerCase()
    .replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[ؤ]/g,'و').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/[\u200c\u200f\u200e\u00a0]/g,' ');
}
function tokensOf(q){return normSearch(q).split(/\s+/).filter(Boolean)}
function memberMatches(m,tokens){
  if(!tokens.length) return true;
  const hay=FIELDS.map(f=>normSearch(m[f.k]));
  return tokens.every(t=>hay.some(h=>h.includes(t)));
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hl(text,tokens){
  text=String(text??''); if(!tokens.length||!text) return esc(text);
  const n=normSearch(text), mark=new Uint8Array(text.length);
  for(const t of tokens){let i=n.indexOf(t); while(i!==-1){for(let j=i;j<i+t.length;j++)mark[j]=1; i=n.indexOf(t,i+1)}}
  let out='',on=false;
  for(let i=0;i<text.length;i++){
    if(mark[i]&&!on){out+='<mark>';on=true}
    if(!mark[i]&&on){out+='</mark>';on=false}
    out+=esc(text[i]);
  }
  return on?out+'</mark>':out;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function newMember(){const m={id:uid(),docs:DOCS.map(()=>false)};FIELDS.forEach(f=>m[f.k]='');return m}
function hasData(m){return FIELDS.some(f=>f.k!=='status'&&f.k!=='level'&&String(m[f.k]||'').trim())}
function jalaliToday(){
  try{
    const p=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const g=t=>p.find(x=>x.type===t).value; return `${g('year')}/${g('month')}/${g('day')}`;
  }catch(e){return ''}
}

/* ---------- ساخت/خواندن فایل xlsx بدون هیچ کتابخانه خارجی ---------- */
const _enc=new TextEncoder(), _dec=new TextDecoder();
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const parts=[],cd=[];let off=0;
  for(const f of files){
    const nm=_enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);
    lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+sz;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function inflateRaw(raw){
  if(typeof DecompressionStream==='undefined') throw new Error('مرورگر شما از خواندن این فایل پشتیبانی نمی‌کند؛ لطفاً مرورگر را به‌روزرسانی کنید.');
  const s=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);
  let e=u.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('این فایل، اکسل (xlsx) معتبر نیست.');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),
          el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=_dec.decode(u.subarray(p+46,p+46+nl));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true), raw=u.subarray(ds,ds+csz);
    out[name]=()=>method===0?Promise.resolve(raw):inflateRaw(raw);
    p+=46+nl+el+cl;
  }
  return out;
}
const xmlUnesc=s=>s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
  .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
const xmlText=s=>{let o='';s=s.replace(/<rPh\b[\s\S]*?<\/rPh>/g,'');s.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g,(_,t)=>{o+=t});return xmlUnesc(o)};
function colIndex(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const c of m[1])n=n*26+c.charCodeAt(0)-64;return n-1}
function parseSheetXml(sheet,sst){
  const rows=[];
  sheet.replace(/<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g,(_,ra,body)=>{
    const rm=/\br="(\d+)"/.exec(ra); const row=[]; const auto=rows.length;
    (body||'').replace(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g,(__,ca,cb)=>{
      const r=/\br="([A-Z]+\d+)"/.exec(ca), t=/\bt="([^"]+)"/.exec(ca), idx=r?colIndex(r[1]):row.length;
      let val=''; cb=cb||'';
      if(t&&t[1]==='inlineStr') val=xmlText(cb);
      else{
        const v=/<v>([\s\S]*?)<\/v>/.exec(cb); if(v){
          const raw=xmlUnesc(v[1]);
          if(t&&t[1]==='s') val=sst[+raw]??'';
          else if(t&&(t[1]==='str'||t[1]==='e')) val=raw;
          else if(t&&t[1]==='b') val=raw==='1'?'TRUE':'FALSE';
          else val=/e/i.test(raw)&&isFinite(raw)?String(Number(raw)):raw;
        }
      }
      row[idx]=val;
    });
    rows[(rm?+rm[1]:auto+1)-1]=row;
  });
  return Array.from(rows,r=>r||[]);
}
/* همهٔ برگه‌های فایل را برمی‌گرداند: [{name, rows}] */
async function parseXlsx(buf){
  const z=unzip(buf), get=async n=>z[n]?_dec.decode(await z[n]()):null;
  const wb=await get('xl/workbook.xml'); if(!wb) throw new Error('این فایل، اکسل (xlsx) معتبر نیست.');
  const rels=(await get('xl/_rels/workbook.xml.rels'))||'', target={};
  rels.replace(/<Relationship\b[^>]*?>/g,t=>{
    const i=/\bId="([^"]+)"/.exec(t), g=/\bTarget="([^"]+)"/.exec(t);
    if(i&&g) target[i[1]]=g[1].startsWith('/')?g[1].slice(1):'xl/'+g[1];
  });
  const sst=[], sstXml=await get('xl/sharedStrings.xml');
  if(sstXml) sstXml.replace(/<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g,(_,b)=>{sst.push(b?xmlText(b):'')});
  const sheets=[]; let n=0;
  for(const t of (wb.match(/<sheet\b[^>]*?\/>/g)||[])){
    n++;
    const nm=/\bname="([^"]*)"/.exec(t), id=/\br:id="([^"]+)"/.exec(t);
    const xml=await get((id&&target[id[1]])||`xl/worksheets/sheet${n}.xml`); if(!xml) continue;
    sheets.push({name:nm?xmlUnesc(nm[1]):'Sheet'+n,rows:parseSheetXml(xml,sst)});
  }
  if(!sheets.length) throw new Error('برگه‌ای در فایل پیدا نشد.');
  return sheets;
}
function normHeader(s){return cleanText(s).replace(/[\s\u200c]/g,'')}
/* تبدیل ردیف‌های اکسل به اعضا */
function rowsToMembers(rows){
  const map={}; FIELDS.forEach(f=>{map[normHeader(f.l)]=f.k;(HEADER_ALIASES[f.k]||[]).forEach(a=>map[normHeader(a)]=f.k)});
  let hi=-1,cols={};
  for(let i=0;i<Math.min(rows.length,60);i++){
    const c={};let n=0;
    (rows[i]||[]).forEach((v,j)=>{const k=map[normHeader(v)];if(k&&!(k in c)){c[k]=j;n++}});
    if(n>=3){hi=i;cols=c;break}
  }
  if(hi<0) throw new Error('سرتیتر جدول (مثل «نام شرکت» و «کد ملی») در فایل پیدا نشد.');
  const list=[];let skipped=0,fixed=0;
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]||[], m=newMember();
    FIELDS.forEach(f=>{
      if(!(f.k in cols)) return;
      const raw=r[cols[f.k]]??''; const v=normField(f,raw);
      if(v!==cleanText(raw)) fixed++;
      m[f.k]=v;
    });
    if(!hasData(m)){skipped++;continue}
    if(m.status && m.status!=='کامل') m.status='ناقص';
    if(m.status==='کامل') m.docs=DOCS.map(()=>true);
    list.push(m);
  }
  return {members:list,skipped:skipped-0,fixed,headerRow:hi+1};
}

/* خروجی اکسل */
const xesc=s=>String(s??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}

  const cell=(c,r,v,s,num)=>{
    const ref=colName(c)+r;
    if(v===''||v==null) return `<c r="${ref}" s="${s}"/>`;
    return num?`<c r="${ref}" s="${s}"><v>${v}</v></c>`:`<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
  };

    rowsXml+=`<row r="${r}">${cell(0,r,i+1,3,true)}${FIELDS.map((f,c)=>cell(c+1,r,m[f.k],2)).join('')}</row>`;
  });
  const colIdx=k=>colName(FIELDS.findIndex(f=>f.k===k)+1);
  const dv=(k,list)=>`<dataValidation type="list" allowBlank="1" showErrorMessage="0" sqref="${colIdx(k)}2:${colIdx(k)}2000"><formula1>"${list}"</formula1></dataValidation>`;
  const sheetXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:${last}${nr}"/><sheetViews><sheetView rightToLeft="1" tabSelected="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="21"/><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rowsXml}</sheetData><autoFilter ref="A1:${last}${nr}"/><dataValidations count="3">${dv('level','1,2,3')}${dv('status','کامل,ناقص')}${dv('field','عمران,معماری')}</dataValidations><pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/></worksheet>`;
  const font=(b)=>`<font>${b?'<b/>':''}<sz val="12"/><name val="B Nazanin"/><family val="2"/><charset val="178"/></font>`;
  const al='<alignment horizontal="center" vertical="center" wrapText="1"/>';
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2">${font(0)}${font(1)}</fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFD9E2F3"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color auto="1"/></left><right style="thin"><color auto="1"/></right><top style="thin"><color auto="1"/></top><bottom style="thin"><color auto="1"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${al}</xf><xf numFmtId="49" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1">${al}</xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1">${al}</xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

   ['[Content_Types].xml',X+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
   ['_rels/.rels',X+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],

/* ---------- محاسبهٔ چیدمان پرینت ---------- */
const PAPER={A4:[297,210],A3:[420,297]};
const WRAP_KEYS=['company','ceo','lastDegree','workAddr','homeAddr'];
function printLayout(cols,list,paper,orient,manualFont){
  const [long,short]=PAPER[paper]||PAPER.A4, usable=((orient==='landscape'?long:short)-16)*3.78;
  const info=cols.map(f=>{
    const maxC=Math.max(0,...list.map(m=>String(m[f.k]||'').length));
    const word=Math.max(...f.l.split(' ').map(w=>w.length));
    const wrap=WRAP_KEYS.includes(f.k);
    // ستون‌های کوتاه (تاریخ، تلفن، کد…) هرگز شکسته نمی‌شوند؛ ستون‌های متنی می‌توانند چندخطی شوند
    return {k:f.k,wrap,chars:wrap?Math.max(word,Math.min(maxC,14)):Math.max(maxC,word)};
  });
  const total=info.reduce((a,c)=>a+c.chars,0)+3;
  const px=manualFont?manualFont*1.333:Math.max(6.5,Math.min(14,(usable-(cols.length+1)*8)/(total*0.64)));
  return {fontPx:px,nowrap:new Set(info.filter(c=>!c.wrap).map(c=>c.k))};
}

  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);DB.members=Array.isArray(o.members)?o.members:[];DB.lastExport=o.lastExport||null;DB.dirty=o.dirty||0}}

/* ---------- لیست و جدول ---------- */
function currentList(){
  const tokens=tokensOf(view.q);
  let arr=DB.members.map((m,i)=>({m,i})).filter(({m})=>
    memberMatches(m,tokens)&&(!view.level||m.level===view.level)&&(!view.status||m.status===view.status)&&(!view.field||m.field===view.field));
  if(view.sort){
    const k=view.sort,d=view.dir;
    arr.sort((a,b)=>{
      const x=k==='_i'?a.i:String(a.m[k]||''), y=k==='_i'?b.i:String(b.m[k]||'');
      if(!x&&y) return 1; if(x&&!y) return -1;
      return (k==='_i'?x-y:x.localeCompare(y,'fa',{numeric:true}))*d;
    });
  }
  return arr;
}
function nidFlags(m,dupSet){
  const f=[]; if(!m.nationalId) return f;
  if(!validNid(m.nationalId)) f.push('کد ملی معتبر به نظر نمی‌رسد');
  if(dupSet.has(m.nationalId)) f.push('کد ملی تکراری است');
  return f;
}
function renderTable(){
  const tokens=tokensOf(view.q), arr=currentList();
  const dupCount={};DB.members.forEach(m=>{if(m.nationalId)dupCount[m.nationalId]=(dupCount[m.nationalId]||0)+1});
  const dupSet=new Set(Object.keys(dupCount).filter(k=>dupCount[k]>1));
  const th=(k,l,cls)=>`<th class="${cls||''}" data-sort="${k}">${esc(l)}${view.sort===k?`<span class="arrow">${view.dir>0?'▲':'▼'}</span>`:''}</th>`;

  $('tbl').tBodies[0].innerHTML=arr.map(({m,i})=>{
    const tds=FIELDS.map(f=>{

    }).join('');
    return `<tr data-id="${m.id}"><td class="s1">${i+1}</td>${tds}<td class="act"><button class="btn sm" data-edit>ویرایش</button> <button class="btn sm danger" data-del>حذف</button></td></tr>`;

    emp.hidden=false; $('tableWrap').hidden=false;

  renderChips(); refreshFieldFilter();
}
function refreshFieldFilter(){

  else if(k==='status') el=`<select ${attrs}><option value=""></option><option>کامل</option><option>ناقص</option></select>`;
  else if(f.long) el=`<textarea ${attrs} rows="2"></textarea>`;
  else{
    const num=['nationalId','memberNo','engNo','licenseNo','mobile','phone'].includes(k)||f.date;
    el=`<input ${attrs} ${OPTS[k]?`list="dl_${k}"`:''} ${num?'class="num" dir="ltr"':''} ${f.date?'placeholder="1405/01/01"':''} ${['nationalId','mobile','phone'].includes(k)?'inputmode="numeric"':''}>`;
  }
  return `<label class="f ${cls||''}">${esc(f.l)}${el}<span class="hint" id="h_${k}"></span></label>`;
}
function buildForm(){
  $('formBody').innerHTML=
   `<fieldset><legend>اطلاعات شرکت و مدیر عامل</legend><div class="grid">${inp('company','two')}${inp('memberNo')}${inp('ceo','two')}${inp('nationalId')}${inp('joinDate')}</div></fieldset>`+
   `<fieldset><legend>تحصیلات مدیر عامل</legend><div class="grid">${inp('field')}${inp('bachelor')}${inp('lastDegree')}</div></fieldset>`+
   `<fieldset><legend>نظام مهندسی و پروانه اجرا</legend><div class="grid">${inp('engNo')}${inp('licenseNo')}${inp('level')}${inp('firstLicense')}${inp('licenseExpiry')}</div></fieldset>`+
   `<fieldset><legend>آدرس و تماس</legend><div class="grid">${inp('workAddr','full')}${inp('homeAddr','full')}${inp('mobile')}${inp('phone')}</div></fieldset>`+
   `<fieldset><legend>مدارک ضمیمه</legend><div class="grid">${inp('status')}</div><div class="docs">${DOCS.map((d,i)=>`<label><input type="checkbox" id="doc${i}"> ${esc(d)}</label>`).join('')}</div></fieldset>`+
   Object.keys(OPTS).map(k=>`<datalist id="dl_${k}">${OPTS[k].map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`).join('');
  DOCS.forEach((_,i)=>$('doc'+i).addEventListener('change',()=>{
    const all=DOCS.every((__,j)=>$('doc'+j).checked); $('f_status').value=all?'کامل':'ناقص';
  }));
  $('f_nationalId').addEventListener('input',hintNid);
  $('f_mobile').addEventListener('input',hintMobile);
  FIELDS.filter(f=>f.date).forEach(f=>$('f_'+f.k).addEventListener('input',()=>hintDate(f.k)));
}
function setHint(k,msg,bad){const h=$('h_'+k);h.textContent=msg||'';h.className='hint'+(bad?' bad':'')}
function hintNid(){
  const v=fixNid($('f_nationalId').value); if(!v){setHint('nationalId');return}
  const dup=DB.members.some(m=>m.id!==editingId&&m.nationalId===v);
  if(dup) setHint('nationalId','این کد ملی قبلاً برای عضو دیگری ثبت شده است',true);
  else if(!validNid(v)) setHint('nationalId','کد ملی معتبر به نظر نمی‌رسد (قابل ذخیره است)');
  else setHint('nationalId');
}
function hintMobile(){const v=fixPhone($('f_mobile').value,true);setHint('mobile',v&&!/^09\d{9}$/.test(v)?'شماره همراه معمولاً ۱۱ رقم و با ۰۹ شروع می‌شود':'')}
function hintDate(k){const v=fixDate($('f_'+k).value);setHint(k,v&&!/^\d{4}(\/\d{2}\/\d{2})?$/.test(v)?'قالب پیشنهادی: 1405/06/31':'')}
function openForm(id){
  editingId=id||null;
  const m=id?DB.members.find(x=>x.id===id):newMember();
  if(!id) m.joinDate=jalaliToday();
  $('formTitle').textContent=id?'ویرایش عضو':'افزودن عضو';
  FIELDS.forEach(f=>{
    const el=$('f_'+f.k);
    if(el.tagName==='SELECT'&&m[f.k]&&![...el.options].some(o=>o.value===m[f.k])) el.add(new Option(m[f.k],m[f.k]));
    el.value=m[f.k]||''; setHint(f.k);
  });
  DOCS.forEach((_,i)=>$('doc'+i).checked=!!(m.docs&&m.docs[i]));
  if(!id) $('f_status').value='ناقص';
  hintNid();
  $('dlgForm').showModal(); $('f_company').focus();
}
function saveForm(e){
  e.preventDefault();
  const v={}; FIELDS.forEach(f=>v[f.k]=normField(f,$('f_'+f.k).value));
  v.docs=DOCS.map((_,i)=>$('doc'+i).checked);
  if(!v.company&&!v.ceo){toast('حداقل نام شرکت یا نام مدیر عامل را وارد کنید',true);$('f_company').focus();return}
  if(v.nationalId&&DB.members.some(m=>m.id!==editingId&&m.nationalId===v.nationalId)&&!confirm('این کد ملی قبلاً برای عضو دیگری ثبت شده است. باز هم ذخیره شود؟')) return;
  if(editingId){const m=DB.members.find(x=>x.id===editingId);Object.assign(m,v)}
  else DB.members.push(Object.assign(newMember(),v));
  persist(true); renderTable(); $('dlgForm').close();
  toast(editingId?'تغییرات ذخیره شد':'عضو جدید ذخیره شد');
}
function deleteMember(id){
  const m=DB.members.find(x=>x.id===id); if(!m) return;
  if(!confirm(`عضو «${m.company||m.ceo}» حذف شود؟`)) return;
  DB.members=DB.members.filter(x=>x.id!==id); persist(true); renderTable(); toast('حذف شد');
}

/* ---------- ورود/خروج ---------- */
const stamp=()=>jalaliToday().replace(/\//g,'-');
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function exportExcel(){
  if(!DB.members.length){toast('هنوز عضوی برای خروجی گرفتن وجود ندارد',true);return}
  download(buildXlsx(DB.members),`members-${stamp()}.xlsx`);
  DB.dirty=0; DB.lastExport=new Date().toISOString(); persist(false); toast('فایل اکسل ساخته شد');
}
let pendingImport=null, pendingSheets=[];
function showImportMsg(){
  const res=pendingImport=pendingSheets[+$('impSheet').value].res;
  const extra=[res.skipped?`${fa(res.skipped)} ردیف خالی نادیده گرفته شد`:'',res.fixed?`${fa(res.fixed)} مقدار (کد ملی، تلفن و تاریخ) استاندارد شد`:''].filter(Boolean).join(' · ');
  $('impMsg').innerHTML=`در این برگه <b>${fa(res.members.length)}</b> عضو پیدا شد. در حال حاضر <b>${fa(DB.members.length)}</b> عضو در سایت ثبت است.<br>${extra?`<small style="color:var(--muted)">${extra}</small><br>`:''}<small style="color:var(--muted)">در حالت «افزودن»، اعضایی که کد ملی‌شان از قبل ثبت شده رد می‌شوند.</small>`;
}
async function onXlsx(file){
  if(!file) return;
  try{
    const sheets=await parseXlsx(await file.arrayBuffer()), found=[];
    sheets.forEach(sh=>{try{const res=rowsToMembers(sh.rows);if(res.members.length)found.push({name:sh.name,res})}catch(e){}});
    if(!found.length){toast('در هیچ‌کدام از برگه‌های فایل، جدول اعضا (با سرتیتر «نام شرکت» و «کد ملی») پیدا نشد',true);return}
    pendingSheets=found;
    // پیش‌فرض: برگه‌ای که بیشترین عضو را دارد
    let best=0; found.forEach((f,i)=>{if(f.res.members.length>found[best].res.members.length)best=i});
    $('impSheet').innerHTML=found.map((f,i)=>`<option value="${i}">${esc(f.name)} — ${fa(f.res.members.length)} عضو</option>`).join('');
    $('impSheet').value=best; $('impSheetRow').hidden=found.length<2;
    pendingImport=found[best].res;
    if(!DB.members.length){applyImport('replace');return}
    showImportMsg(); $('dlgImport').showModal();
  }catch(err){toast(err.message||'خواندن فایل ناموفق بود',true)}
}
function applyImport(mode){
  const res=pendingImport; if(!res) return; let added=0,dups=0;
  if(mode==='replace'){DB.members=res.members;added=res.members.length}
  else{
    const have=new Set(DB.members.map(m=>m.nationalId).filter(Boolean));
    res.members.forEach(m=>{if(m.nationalId&&have.has(m.nationalId)){dups++;return}DB.members.push(m);added++;if(m.nationalId)have.add(m.nationalId)});
  }
  pendingImport=null; persist(true); renderTable(); $('dlgImport').close();
  toast(`${fa(added)} عضو وارد شد`+(dups?` (${fa(dups)} مورد تکراری رد شد)`:''));
}
function backupJson(){
  download(new Blob([JSON.stringify({app:'membership',version:1,members:DB.members},null,1)],{type:'application/json'}),`members-backup-${stamp()}.json`);
  toast('فایل پشتیبان ساخته شد');
}
async function restoreJson(file){
  if(!file) return;
  try{
    const o=JSON.parse(await file.text()); if(!o||!Array.isArray(o.members)) throw 0;
    if(DB.members.length&&!confirm('لیست فعلی با فایل پشتیبان جایگزین می‌شود. ادامه می‌دهید؟')) return;
    DB.members=o.members.map(m=>Object.assign(newMember(),m,{id:m.id||uid()})); persist(true); renderTable(); toast(`${fa(DB.members.length)} عضو بازیابی شد`);
  }catch(e){toast('این فایل، پشتیبان معتبر نیست',true)}
}

/* ---------- پرینت ---------- */
function loadPrintCfg(){
  let c={paper:'A4',orient:'landscape',title:'',scope:'all',font:'auto',hideEmpty:true,cols:FIELDS.map(f=>f.k)};
  try{Object.assign(c,JSON.parse(localStorage.getItem(PKEY)||'{}'))}catch(e){}
  return c;
}
function openPrint(){
  if(!DB.members.length){toast('هنوز عضوی برای پرینت وجود ندارد',true);return}
  const c=loadPrintCfg();
  $('pPaper').value=c.paper;$('pOrient').value=c.orient;$('pTitle').value=c.title;$('pFont').value=c.font;$('pHideEmpty').checked=c.hideEmpty;
  const filtered=currentList().length, sc=$('pScope');
  sc.options[1].textContent=`فقط نتیجه جستجو / فیلتر فعلی (${fa(filtered)} عضو)`;
  sc.value=(c.scope==='filtered'&&filtered!==DB.members.length)||(view.q||view.level||view.status||view.field)&&filtered!==DB.members.length?'filtered':'all';
  $('pCols').innerHTML=FIELDS.map(f=>`<label><input type="checkbox" value="${f.k}" ${c.cols.includes(f.k)?'checked':''}> ${esc(f.l)}</label>`).join('');
  $('dlgPrint').showModal();
}
function doPrint(){
  const cfg={paper:$('pPaper').value,orient:$('pOrient').value,title:$('pTitle').value.trim(),scope:$('pScope').value,font:$('pFont').value,hideEmpty:$('pHideEmpty').checked,
            cols:[...$('pCols').querySelectorAll('input:checked')].map(i=>i.value)};
  if(!cfg.cols.length){toast('حداقل یک ستون را انتخاب کنید',true);return}
  try{localStorage.setItem(PKEY,JSON.stringify(cfg))}catch(e){}
  let src=cfg.scope==='filtered'?currentList():DB.members.map((m,i)=>({m,i}));
  src=src.filter(({m})=>hasData(m));
  if(!src.length){toast('عضوی برای چاپ وجود ندارد',true);return}
  const list=src.map(s=>s.m);
  let cols=FIELDS.filter(f=>cfg.cols.includes(f.k));
  if(cfg.hideEmpty) cols=cols.filter(f=>list.some(m=>String(m[f.k]||'').trim()));
  if(!cols.length) cols=FIELDS.filter(f=>cfg.cols.includes(f.k));
  const L=printLayout(cols,list,cfg.paper,cfg.orient,cfg.font==='auto'?0:+cfg.font);
  $('pageStyle').textContent=`@page{size:${cfg.paper} ${cfg.orient};margin:8mm 8mm 11mm;@bottom-center{content:counter(page);font-size:9pt;font-family:Tahoma,sans-serif}}`;
  const pa=$('printArea');
  pa.style.fontSize=L.fontPx.toFixed(2)+'px';
  pa.innerHTML=(cfg.title?`<h2>${esc(cfg.title)}</h2>`:'')+
    `<table><thead><tr><th class="nw">ردیف</th>${cols.map(f=>`<th>${esc(f.l)}</th>`).join('')}</tr></thead><tbody>`+
    src.map(({m,i})=>`<tr><td class="nw">${i+1}</td>${cols.map(f=>`<td${L.nowrap.has(f.k)?' class="nw"':''}>${esc(m[f.k]||'')}</td>`).join('')}</tr>`).join('')+`</tbody></table>`;
  $('dlgPrint').close();
  setTimeout(()=>window.print(),120);
}

/* ---------- اتصال رویدادها ---------- */
function init(){
  loadDB(); buildForm();
  if(!storageOK) toast('ذخیره‌سازی مرورگر غیرفعال است؛ اطلاعات پس از بستن صفحه از بین می‌رود.',true);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  $('btnAdd').onclick=()=>openForm();
  $('btnImport').onclick=()=>{$('fileXlsx').value='';$('fileXlsx').click()};
  $('fileXlsx').onchange=e=>onXlsx(e.target.files[0]);
  $('btnExport').onclick=exportExcel;
  $('dirtyChip').onclick=exportExcel;
  $('btnPrint').onclick=openPrint;
  $('pGo').onclick=doPrint;
  $('btnBackup').onclick=()=>{$('moreMenu').open=false;backupJson()};
  $('btnRestore').onclick=()=>{$('moreMenu').open=false;$('fileJson').value='';$('fileJson').click()};
  $('fileJson').onchange=e=>restoreJson(e.target.files[0]);
  $('btnClear').onclick=()=>{
    $('moreMenu').open=false;
    if(DB.members.length&&confirm('همه اعضا حذف شوند؟ (پیشنهاد می‌شود قبلاً خروجی اکسل یا پشتیبان بگیرید)')){DB.members=[];persist(true);renderTable();toast('همه اعضا حذف شدند')}
  };
  $('impAdd').onclick=()=>applyImport('add');
  $('impSheet').onchange=showImportMsg;
  $('impReplace').onclick=()=>{if(confirm('کل لیست فعلی حذف و با فایل جایگزین شود؟')) applyImport('replace')};
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>e.target.closest('dialog').close()));
  $('form').addEventListener('submit',saveForm);
  let qt; $('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{view.q=e.target.value;$('searchBox').classList.toggle('has',!!view.q);renderTable()},120)});
  $('qClear').onclick=()=>{$('q').value='';view.q='';$('searchBox').classList.remove('has');renderTable();$('q').focus()};
  $('fLevel').onchange=e=>{view.level=e.target.value;renderTable()};
  $('fStatus').onchange=e=>{view.status=e.target.value;renderTable()};
  $('fField').onchange=e=>{view.field=e.target.value;renderTable()};
  $('tbl').tHead.addEventListener('click',e=>{
    const th=e.target.closest('th[data-sort]'); if(!th) return; const k=th.dataset.sort;
    if(view.sort===k){if(view.dir===1)view.dir=-1;else{view.sort=null;view.dir=1}}else{view.sort=k;view.dir=1}
    renderTable();
  });
  $('tbl').tBodies[0].addEventListener('click',e=>{
    const tr=e.target.closest('tr[data-id]'); if(!tr) return;
    if(e.target.closest('[data-del]')) deleteMember(tr.dataset.id); else openForm(tr.dataset.id);
  });
  $('empty').addEventListener('click',e=>{const a=e.target.dataset.act;if(a==='add')openForm();if(a==='import')$('btnImport').click()});
  document.addEventListener('keydown',e=>{
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();$('q').focus()}
  });
  document.addEventListener('click',e=>{const m=$('moreMenu');if(m.open&&!m.contains(e.target))m.open=false});
  window.addEventListener('afterprint',()=>{$('printArea').innerHTML=''});
  renderTable();
}
if(typeof document!=='undefined'&&document.getElementById('tbl')) init();
</script>
